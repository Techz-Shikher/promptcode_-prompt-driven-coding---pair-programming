name: Quality and Security

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Type check
        run: npm run lint
      - name: Run unit tests
        run: npm test
      - name: Build client and server
        run: npm run build
      - name: Check VS Code extension
        run: npm run vscode-check
      - name: Audit dependency vulnerabilities
        run: npm audit --audit-level=high
      - name: Scan tracked files for common secrets
        run: npm run secret-scan
