services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: promptcode
      POSTGRES_USER: promptcode
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}
    volumes:
      - promptcode-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promptcode -d promptcode"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    environment:
      NODE_ENV: production
      PORT: "3000"
      REQUIRE_DATABASE: "true"
      DATABASE_URL: postgresql://promptcode:${POSTGRES_PASSWORD}@db:5432/promptcode
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      TRUST_PROXY_HOPS: "0"
    ports:
      - "127.0.0.1:${PROMPTCODE_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  promptcode-postgres:
